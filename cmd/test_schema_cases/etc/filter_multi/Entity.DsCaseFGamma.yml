# ══════════════════════════════════════════════════════════════
Table:
  type: entity
  table: ds_case_f_gamma
  options:
    charset: utf8mb4
    collate: utf8mb4_general_ci
    comment: 过滤用例表 gamma（应被排除）
  id:
    id:
      type: integer unsigned
      nullable: false
      generator: AUTO_INCREMENT
      comment: 主键
  fields:
    name:
      type: varchar(32)
      nullable: false
      default: ''
      comment: 名称
